# De dónde sale la música real del sitio. Después de editar: bin/rails music:sync
#
# apple_artist_id: tu id en Apple Music (el número en music.apple.com/mx/artist/martini/<id>).
#   De ahí se descargan discos, portadas y previews de 30 s del Lado A.
# since: sólo se importan lanzamientos desde esta fecha (Rendido en adelante).
# spotify_tracks: Spotify no da previews por API, así que sólo guardamos el link de cada
#   canción para el botón "Spotify". La llave es el título tal como aparece en Apple Music.
# production_credits: canciones donde participé en la producción (Lado B).
#   Las APIs no exponen créditos, así que la lista es manual. Para agregar una:
#     - spotify: el id del link open.spotify.com/track/<id>   (obligatorio)
#       apple: el id del track en Apple Music, si existe        (opcional: da preview de 30 s)
#       artists: quién la firma, si no está en Apple             (opcional)
#       released: fecha de salida, si no está en Apple            (opcional, para ordenar)
#       role: qué hice                                          (opcional, default "producción")

