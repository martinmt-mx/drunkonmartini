# Sección "Escena": artistas de Colima que recomiendo. Después de editar: bin/rails music:sync
#
# Para agregar a alguien (pídele permiso primero):
#   - name: cómo se escribe su nombre artístico               (obligatorio)
#     instagram: su usuario, sin @                            (obligatorio)
#     apple: id de la canción destacada en Apple Music        (opcional: da portada y preview)
#            es el número final de music.apple.com/.../song/<nombre>/<id> o el ?i=<id>
#     apple_artist: id del perfil en Apple Music              (opcional: sólo si la canción es
#            de otro artista, p. ej. un feat.; si no, se usa el artista de la canción)
#     spotify: link del PERFIL del artista en Spotify         (opcional; sin él no hay botón)
#     genre: una o dos palabras                               (opcional)
#     links: { tiktok: "...", youtube: "..." }                (opcional)
#
# El orden de la lista es el orden en la página.

