# Blueprint de Render: describe el servicio para crearlo con un clic
# (Render → New → Blueprint → elegir este repo).
services:
  - type: web
    name: drunkonmartini
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true # cada merge a main publica solo
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true # Render inventa una clave secreta segura
      - key: CONTACT_EMAIL
        value: martinimusic.prod@gmail.com # adonde llegan los mensajes del formulario
      - key: RESEND_API_KEY
        sync: false # llave de resend.com; se pega en Render, nunca va en el repo
